name: Deploy to Clever Cloud

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CLEVER_SSH_KEY }}

      - name: Push to Clever Cloud
        run: |
          git remote add clever ${{ secrets.CLEVER_GIT_URL }}
          GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=no" git push clever HEAD:main --force
